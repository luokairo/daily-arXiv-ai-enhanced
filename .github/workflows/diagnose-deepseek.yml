name: DeepSeek Pipeline Diagnostic

on:
  workflow_dispatch:
    inputs:
      data_date:
        description: Existing raw data date (YYYY-MM-DD)
        required: true
        default: '2026-09-17'
        type: string
      paper_id:
        description: Optional comma-separated paper IDs from the historical file
        required: false
        type: string
      sample_limit:
        description: Maximum unique papers to review (1-20)
        default: '1'
        type: string
      secondary_detail_limit:
        description: Secondary detail budget for this diagnostic (0-20)
        default: '15'
        type: string
      deep_read_top_k:
        description: Maximum full-text deep reads (1-3)
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      MODEL_NAME: deepseek-flash
      DETAIL_MODEL_NAME: deepseek-flash
      FILTER_MODEL_NAME: deepseek-flash
      FILTER_MAX_OUTPUT_TOKENS: ${{ vars.FILTER_MAX_OUTPUT_TOKENS || '512' }}
      DEEP_READ_MODEL_NAME: deepseek-flash
      DEEPSEEK_THINKING: 'false'
      DEEP_READ_THINKING: 'false'
      DETAIL_MAX_OUTPUT_TOKENS: ${{ vars.DETAIL_MAX_OUTPUT_TOKENS || '2500' }}
      DEEP_READ_MAX_OUTPUT_TOKENS: ${{ vars.DEEP_READ_MAX_OUTPUT_TOKENS || '6000' }}
      DEEP_READ_MAX_CONTEXT_CHARS: ${{ vars.DEEP_READ_MAX_CONTEXT_CHARS || '40000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Load historical inputs
        env:
          DATA_DATE: ${{ inputs.data_date }}
        run: |
          [[ "$DATA_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          git fetch --depth=1 origin data
          git show "FETCH_HEAD:data/${DATA_DATE}.jsonl" > "$RUNNER_TEMP/papers.jsonl"
          if ! git show "FETCH_HEAD:data/taxonomy.json" > "$RUNNER_TEMP/taxonomy.json"; then
            echo '{}' > "$RUNNER_TEMP/taxonomy.json"
          fi
      - name: Test bounded historical routing, allocation and deep reading
        env:
          PAPER_ID: ${{ inputs.paper_id }}
          SAMPLE_LIMIT: ${{ inputs.sample_limit || '1' }}
          SECONDARY_LIMIT: ${{ inputs.secondary_detail_limit || '15' }}
          DEEP_READ_LIMIT: ${{ inputs.deep_read_top_k || '1' }}
        run: |
          .venv/bin/python scripts/diagnose_pipeline.py \
            --data "$RUNNER_TEMP/papers.jsonl" \
            --taxonomy "$RUNNER_TEMP/taxonomy.json" \
            --paper-id "$PAPER_ID" \
            --sample-limit "$SAMPLE_LIMIT" \
            --secondary-detail-limit "$SECONDARY_LIMIT" \
            --deep-read-top-k "$DEEP_READ_LIMIT" \
            --output "$RUNNER_TEMP/deepseek-diagnostic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-diagnostic
          path: ${{ runner.temp }}/deepseek-diagnostic
          if-no-files-found: ignore
