name: Verify automatic recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'
      - '.github/workflows/verify-recovery.yml'
      - 'scripts/**'
      - 'ai/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --locked
      - name: Verify scheduled deferral and recovery with isolated providers
        run: .venv/bin/python -m unittest discover -s tests
