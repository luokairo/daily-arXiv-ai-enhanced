# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: arXiv-daily-ai-enhanced

on:
  schedule:
    # GitHub schedule uses UTC and may be delayed at busy minutes.
    # 17:23 UTC = 01:23 Asia/Shanghai on the following day, in DeepSeek off-peak hours.
    # Process the latest published announcement, retaining its actual date.
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Exact arXiv announcement date YYYY-MM-DD; blank uses latest listed day"
        required: false
        type: string


permissions:
  contents: write
  actions: read

concurrency:
  group: daily-arxiv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      SELECTION_MODE: ${{ vars.SELECTION_MODE || 'semantic' }}
      MAX_AI_CANDIDATES: ${{ vars.MAX_AI_CANDIDATES || '150' }}
      SECONDARY_DETAIL_LIMIT: ${{ vars.SECONDARY_DETAIL_LIMIT || '10' }}
      FILTER_MAX_OUTPUT_TOKENS: ${{ vars.FILTER_MAX_OUTPUT_TOKENS || '512' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'deepseek-flash' }}
      DETAIL_MODEL_NAME: ${{ vars.DETAIL_MODEL_NAME || vars.MODEL_NAME || 'deepseek-flash' }}
      FILTER_MODEL_NAME: ${{ vars.FILTER_MODEL_NAME || vars.MODEL_NAME || 'deepseek-flash' }}
      IMPORTANCE_MODEL_NAME: ${{ vars.IMPORTANCE_MODEL_NAME || vars.MODEL_NAME || 'deepseek-flash' }}
      DEEP_READ_MODEL_NAME: ${{ vars.DEEP_READ_MODEL_NAME || vars.MODEL_NAME || 'deepseek-flash' }}
      DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING || 'false' }}
      DEEP_READ_THINKING: ${{ vars.DEEP_READ_THINKING || 'false' }}
      DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT || 'low' }}
      GLM_REASONING_EFFORT: ${{ vars.GLM_REASONING_EFFORT || 'low' }}
      MAX_DETAIL_ITEMS: ${{ vars.MAX_DETAIL_ITEMS || '50' }}
      DAILY_DEEP_READ_TOP_K: ${{ vars.DAILY_DEEP_READ_TOP_K || '3' }}
      DETAIL_MAX_OUTPUT_TOKENS: ${{ vars.DETAIL_MAX_OUTPUT_TOKENS || '2500' }}
      DEEP_READ_MAX_OUTPUT_TOKENS: ${{ vars.DEEP_READ_MAX_OUTPUT_TOKENS || '6000' }}
      DEEP_READ_MAX_CONTEXT_CHARS: ${{ vars.DEEP_READ_MAX_CONTEXT_CHARS || '40000' }}
      USE_MODEL_FILTER: ${{ vars.USE_MODEL_FILTER || 'false' }}
      USE_MODEL_IMPORTANCE: ${{ vars.USE_MODEL_IMPORTANCE || 'false' }}
      ENABLE_DEEP_READ: ${{ vars.ENABLE_DEEP_READ || 'true' }}
      FILTER_MAX_WORKERS: ${{ vars.FILTER_MAX_WORKERS || '4' }}
      DETAIL_MAX_WORKERS: ${{ vars.DETAIL_MAX_WORKERS || '2' }}
      IMPORTANCE_MAX_WORKERS: ${{ vars.IMPORTANCE_MAX_WORKERS || '1' }}
      DEEP_READ_MAX_WORKERS: ${{ vars.DEEP_READ_MAX_WORKERS || '1' }}
      LANGUAGE: ${{ vars.LANGUAGE || 'Chinese' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
      CATEGORIES: ${{ vars.CATEGORIES || 'cs.CV, cs.CL' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      AI_OUTPUT_DIR: /tmp/arxiv-stage
      # Scheduled runs stop new paid requests outside the guarded off-peak window.
      # Manual runs and diagnostics remain unrestricted unless explicitly enabled.
      ENFORCE_DEEPSEEK_OFF_PEAK: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync --locked

    - name: Restore previous data branch files
      run: |
        echo "恢复 data 分支历史数据... / Restoring previous data branch files..."
        mkdir -p data assets
        if git ls-remote --heads origin data | grep -q data; then
          git fetch origin data
          git checkout origin/data -- data 2>/dev/null || true
          git checkout origin/data -- assets/file-list.txt 2>/dev/null || true
        else
          echo "data 分支不存在，跳过历史数据恢复 / Data branch does not exist, skip restore"
        fi
        
    - name: Restore successful cache from recovery artifacts
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RECOVERY_DATE: ${{ inputs.target_date }}
      run: .venv/bin/python scripts/recovery.py restore --date "$RECOVERY_DATE"

    - name: Crawl date-verified arXiv papers
      id: crawl_step
      env:
        REQUESTED_DATE: ${{ inputs.target_date }}
      run: |
        source .venv/bin/activate
        python scripts/crawl_dated.py --date "$REQUESTED_DATE" \
          --directory data --audit-directory "$AI_OUTPUT_DIR/run_metrics"

    - name: Check dated candidate snapshot
      id: dedup_check
      env:
        PAPER_COUNT: ${{ steps.crawl_step.outputs.paper_count }}
      run: |
        # The dated crawler deduplicates across categories. Cross-day ID filtering
        # would change the verified announcement set, so do not rewrite it here.
        if [ "$PAPER_COUNT" -gt 0 ]; then
          echo "has_new_content=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_new_content=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=no_new_content" >> "$GITHUB_OUTPUT"
        fi

    - name: AI Enhancement Processing
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        mkdir -p "$AI_OUTPUT_DIR"
        export AI_METRICS_PATH="$AI_OUTPUT_DIR/enhance-usage.json"
        echo "开始AI增强处理... / Starting AI enhancement processing..."
        
        cd ai
        export TARGET_DATE="$today"
        
        python enhance.py --data ../data/${today}.jsonl
        
        # 检查AI处理是否成功 / Check if AI processing was successful
        if [ $? -ne 0 ]; then
            echo "AI处理失败 / AI processing failed"
            exit 1
        fi
        echo "AI增强处理完成 / AI enhancement processing completed"
        
    - name: Save selection audit and usage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selection-audit-${{ github.run_id }}
        path: |
          /tmp/arxiv-stage/run_metrics/*-selection.json
          /tmp/arxiv-stage/run_metrics/*-crawl.json
          /tmp/arxiv-stage/enhance-usage.json
        if-no-files-found: ignore

    - name: Convert to Markdown
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        echo "转换为Markdown格式... / Converting to Markdown format..."
        
        # 设置环境变量 / Set environment variables
        export TARGET_DATE="$today"
        
        cd to_md
        
        # 使用AI增强文件进行转换 / Use AI enhanced file for conversion
        AI_FILE="$AI_OUTPUT_DIR/${today}_AI_enhanced_${LANGUAGE}.jsonl"
        
        if [ -f "$AI_FILE" ]; then
            echo "使用AI增强文件进行转换... / Using AI enhanced file for conversion..."
            python convert.py --data "$AI_FILE"
        else
            echo "错误：未找到AI增强文件 / Error: AI enhanced file not found"
            echo "AI文件: $AI_FILE"
            exit 1
        fi
        
        # 检查转换是否成功 / Check if conversion was successful
        if [ $? -ne 0 ]; then
            echo "Markdown转换失败 / Markdown conversion failed"
            exit 1
        fi
        echo "Markdown转换完成 / Markdown conversion completed"

    - name: Deep Read Top Papers
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        if [[ ! "${ENABLE_DEEP_READ,,}" =~ ^(1|true|yes)$ ]]; then
          echo "全文精读已关闭，跳过模型调用 / Deep read disabled, skipping model calls."
          exit 0
        fi
        source .venv/bin/activate
        today=${{ steps.crawl_step.outputs.crawl_date }}
        echo "生成重要论文全文精读... / Generating deep reads for top papers..."

        cd ai

        export AI_METRICS_PATH="$AI_OUTPUT_DIR/deep-read-usage.json"
        AI_FILE="$AI_OUTPUT_DIR/${today}_AI_enhanced_${LANGUAGE}.jsonl"
        if [ -f "$AI_FILE" ]; then
          python deep_read.py \
            --data "$AI_FILE" \
            --output "$AI_OUTPUT_DIR/deep_reads/${today}.md" \
            --output-json "$AI_OUTPUT_DIR/deep_reads/${today}.json"
        else
          echo "错误：未找到AI增强文件，无法生成精读 / Error: AI enhanced file not found for deep reading"
          echo "AI文件: $AI_FILE"
          exit 1
        fi

        echo "全文精读生成完成 / Deep reads completed"
        
    # Runner executes always() on normal cancellation; force-killed runners may lose unsent files.
    - name: Prepare recovery bundle
      continue-on-error: true
      if: always() && steps.crawl_step.outputs.crawl_date != ''
      env:
        RECOVERY_DATE: ${{ steps.crawl_step.outputs.crawl_date }}
      run: .venv/bin/python scripts/recovery.py save --date "$RECOVERY_DATE"

    - name: Upload successful cache and partial audit for recovery
      continue-on-error: true
      if: always() && steps.crawl_step.outputs.crawl_date != ''
      uses: actions/upload-artifact@v4
      with:
        name: ai-recovery-${{ steps.crawl_step.outputs.crawl_date }}-${{ github.run_id }}
        path: /tmp/arxiv-recovery/
        if-no-files-found: ignore
        retention-days: 14

    - name: Publish validated local artifacts
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        .venv/bin/python scripts/publish_staged.py --source "$AI_OUTPUT_DIR" --destination data

    - name: Update file list
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "更新文件列表... / Updating file list..."
        find data -type f -not -path 'data/ai_cache/*' -not -path 'data/run_metrics/*' | sed 's|^data/||' | sort > assets/file-list.txt
        echo "文件列表更新完成 / File list updated"

    - name: Generate password hash and inject into config
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "🔐 Generating password hash for authentication..."

        PASSWORD="${{ secrets.ACCESS_PASSWORD }}"

        if [ -z "$PASSWORD" ]; then
          echo "⚠️  WARNING: ACCESS_PASSWORD not set in Secrets"
          echo "⚠️  Password protection will be DISABLED"
          echo "⚠️  To enable password protection, add ACCESS_PASSWORD in repository Secrets"
          echo "ℹ️  Website will remain publicly accessible without authentication"

          # Use a special value that will disable authentication
          PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
        else
          # Generate SHA-256 hash using openssl
          PASSWORD_HASH=$(echo -n "$PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          echo "✅ Password hash generated successfully"
          echo "✅ Hash length: ${#PASSWORD_HASH} characters"
          echo "🔐 Password protection is ENABLED"
        fi

        # Inject hash into auth-config.js
        if [ -f "js/auth-config.js" ]; then
          sed -i "s/passwordHash: '.*'/passwordHash: '$PASSWORD_HASH'/" js/auth-config.js
          echo "✅ Password hash injected into js/auth-config.js"
        else
          echo "❌ ERROR: js/auth-config.js not found!"
          exit 1
        fi

        echo "🔐 Authentication setup complete"

    - name: Summary
      run: |
        if [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
          echo "✅ 工作流完成：去重发现新内容并成功处理 / Workflow completed: Smart deduplication found new content and processed successfully"
        else
          case "${{ steps.dedup_check.outputs.skip_reason }}" in
            "no_new_content")
              echo "ℹ️ 工作流完成：去重后无新内容 / Workflow completed: No new content after smart deduplication"
              ;;
            "processing_error")
              echo "⚠️ 工作流完成：去重处理出错 / Workflow completed: Deduplication processing error"
              ;;
            "unknown_error")
              echo "⚠️ 工作流完成：未知错误 / Workflow completed: Unknown error"
              ;;
            *)
              echo "ℹ️ 工作流完成：未知原因跳过处理 / Workflow completed: Skipped for unknown reason"
              ;;
          esac
        fi
        
    - name: Inject repository info into data-config.js
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "注入仓库信息到 data-config.js... / Injecting repository info into data-config.js..."
        
        # 获取仓库信息 / Get repository information
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        
        echo "仓库所有者: $REPO_OWNER / Repository owner: $REPO_OWNER"
        echo "仓库名称: $REPO_NAME / Repository name: $REPO_NAME"
        
        # 注入仓库信息到 data-config.js / Inject repository info into data-config.js
        if [ -f "js/data-config.js" ]; then
          sed -i "s/repoOwner: '.*'/repoOwner: '$REPO_OWNER'/" js/data-config.js
          sed -i "s/repoName: '.*'/repoName: '$REPO_NAME'/" js/data-config.js
          echo "✅ 仓库信息已注入到 js/data-config.js / Repository info injected into js/data-config.js"
        else
          echo "❌ ERROR: js/data-config.js not found!"
          exit 1
        fi

    - name: Commit code changes to main branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME || github.repository_owner }}"
        
        # 添加所有代码文件，但排除数据文件 / Add all code files, but exclude data files
        git add js/data-config.js
        git add .github/
        # 添加其他可能的代码变更，但排除 data/ 目录和 assets/file-list.txt
        # Add other possible code changes, but exclude data/ directory and assets/file-list.txt
        git add -A
        git reset -- data assets/file-list.txt 2>/dev/null || true
        
        # 检查是否有代码变更需要提交 / Check if there are code changes to commit
        if git diff --staged --quiet; then
          echo "没有代码变更需要提交 / No code changes to commit"
        else
          git commit -m "chore: update data-config.js with repository info"
          echo "代码变更已提交到 main 分支 / Code changes committed to main branch"
        fi

    - name: Push code changes to main branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        # 设置Git配置以处理自动合并 / Set Git config for automatic merging
        git config pull.rebase true
        git config rebase.autoStash true
        
        # 尝试推送代码变更到 main 分支 / Try to push code changes to main branch
        for i in {1..3}; do
          echo "推送代码变更尝试 $i / Push code changes attempt $i"
          if git push origin main; then
            echo "代码变更推送成功 / Code changes pushed successfully"
            break
          else
            echo "推送失败，拉取最新变更... / Push failed, pulling latest changes..."
            git pull origin main --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3次尝试后推送失败 / Failed to push after 3 attempts"
              exit 1
            fi
          fi
        done

    - name: Prepare data files for data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "准备数据文件... / Preparing data files..."
        today=${{ steps.crawl_step.outputs.crawl_date }}
        
        # 创建临时目录保存数据文件 / Create temporary directory to save data files
        mkdir -p /tmp/data_files/data
        mkdir -p /tmp/data_files/assets
        
        # 复制数据文件到临时目录 / Copy data files to temporary directory
        cp -r data/* /tmp/data_files/data/ 2>/dev/null || true
        cp assets/file-list.txt /tmp/data_files/assets/ 2>/dev/null || true
        
        echo "数据文件已保存到临时目录 / Data files saved to temporary directory"

    - name: Setup and commit to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME || github.repository_owner }}"
        
        echo "设置 data 分支... / Setting up data branch..."
        today=${{ steps.crawl_step.outputs.crawl_date }}
        
        # 在切换分支前，清理工作目录中可能冲突的未跟踪文件
        # Before switching branches, clean untracked files that might conflict
        # 这些文件已经保存到临时目录，所以可以安全删除
        # These files are already saved to temporary directory, so safe to remove
        rm -rf data/*.jsonl 2>/dev/null || true
        rm -f data/*.md 2>/dev/null || true
        rm -f data/taxonomy.json 2>/dev/null || true
        rm -rf data/deep_reads data/ai_cache data/run_metrics 2>/dev/null || true
        rm -f assets/file-list.txt 2>/dev/null || true
        
        # 检查 data 分支是否存在 / Check if data branch exists
        if git ls-remote --heads origin data | grep -q data; then
          echo "data 分支已存在，切换到 data 分支 / Data branch exists, switching to data branch"
          git fetch origin data:data
          git checkout data
          git pull origin data || true
        else
          echo "data 分支不存在，创建新分支 / Data branch does not exist, creating new branch"
          # 创建空的 data 分支 / Create empty data branch
          git checkout --orphan data
          git rm -rf --cached . 2>/dev/null || true
          # 确保 data 和 assets 目录存在 / Ensure data and assets directories exist
          mkdir -p data assets
          echo "# Data Branch" > README.md
          git add README.md
          git commit -m "chore: initialize data branch"
          git push origin data
        fi
        
        # 从临时目录恢复数据文件 / Restore data files from temporary directory
        # 确保目录存在 / Ensure directories exist
        mkdir -p data assets
        cp -r /tmp/data_files/data/* data/ 2>/dev/null || true
        cp /tmp/data_files/assets/file-list.txt assets/ 2>/dev/null || true
        
        # 只添加数据文件 / Only add data files
        git add data 2>/dev/null || true
        git add assets/file-list.txt 2>/dev/null || true
        
        # 检查是否有数据变更需要提交 / Check if there are data changes to commit
        if git diff --staged --quiet; then
          echo "没有数据变更需要提交 / No data changes to commit"
        else
          git commit -m "update: $today arXiv papers"
          echo "数据变更已提交到 data 分支 / Data changes committed to data branch"
        fi

    - name: Push data changes to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        # 设置Git配置以处理自动合并 / Set Git config for automatic merging
        git config pull.rebase true
        git config rebase.autoStash true
        
        # 尝试推送数据变更到 data 分支 / Try to push data changes to data branch
        for i in {1..3}; do
          echo "推送数据变更尝试 $i / Push data changes attempt $i"
          if git push origin data; then
            echo "数据变更推送成功 / Data changes pushed successfully"
            break
          else
            echo "推送失败，拉取最新变更... / Push failed, pulling latest changes..."
            git pull origin data --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3次尝试后推送失败 / Failed to push after 3 attempts"
              exit 1
            fi
          fi
        done
