directions:
- id: world_model
  name: 世界模型
  description: 重点关注视频世界模型、动作条件视频预测、长时序未来预测；同时关注物理动力学、交互仿真、具身世界模型及基于世界模型的规划。普通机器人策略或控制论文只有明确涉及世界建模才相关。
  arxiv_categories:
  - cs.CV
  - cs.AI
  - cs.LG
  - cs.RO
  - cs.MM
  keywords:
  - world model
  - video world model
  - generative world model
  - physical world model
  - neural simulator
  - interactive world model
  - embodied world model
  - action-conditioned video
  - dynamics model
  - environment model
  canonical_subtopics:
  - id: video_world_model
    name: 视频世界模型
    description: 视频生成式世界模型、未来预测、长时序视频建模与动作条件视频生成。
    keywords:
    - world model
    - video world model
    - generative world model
    - action-conditioned video
    - future prediction
    - long-horizon video
  - id: interactive_physical_world
    name: 可交互与物理世界建模
    description: 物理一致的世界模型、交互式模拟器、神经仿真器与环境动力学建模。
    keywords:
    - interactive world
    - physical world model
    - neural simulator
    - physics simulation
    - dynamics model
    - environment model
  - id: embodied_world_model
    name: 具身世界模型与规划控制
    description: 面向机器人、具身智能、动作规划和控制的世界模型。
    keywords:
    - embodied world model
    - embodied ai
    - robotics world model
    - planning
    - control
    - policy learning
  - id: spatial_3d_4d_world_model
    name: 空间 3D/4D 世界模型
    description: 3D/4D 场景、空间记忆、神经场与动态场景中的世界建模。
    keywords:
    - 3d world model
    - 4d world model
    - dynamic scene
    - spatial world model
    - neural field
    - 3d gaussian
  tier: primary
- id: video_generation
  name: 视频生成
  tier: primary
  description: 关注扩散、自回归视频生成、长视频和可控生成、视频编辑，以及直接服务于视频生成的表征、训练、效率、评测和数据研究。纯图像生成只有摘要明确说明对视频生成的迁移价值才相关。
  arxiv_categories:
  - cs.CV
  - cs.AI
  - cs.LG
  - cs.MM
  keywords: &id001
  - video generation
  - text-to-video
  - image-to-video
  - video diffusion
  - autoregressive video
  - video editing
  - long video generation
  canonical_subtopics:
  - id: video_diffusion
    name: 视频扩散与流模型
    description: 视频扩散、flow matching、视频 DiT。
    keywords:
    - video diffusion
    - text-to-video
    - video dit
  - id: autoregressive_video
    name: 自回归视频生成
    description: 视频 next-token、离散或连续视频序列生成。
    keywords:
    - autoregressive video
    - video token generation
  - id: long_controllable_video
    name: 长视频与可控生成
    description: 长时序、一致性、镜头控制、个性化视频生成。
    keywords:
    - long video generation
    - controllable video
    - video personalization
  - id: video_editing
    name: 视频编辑
    description: 视频编辑、局部重绘、风格及内容控制。
    keywords:
    - video editing
    - video inpainting
  - id: video_generation_efficiency
    name: 视频生成效率与表征
    description: 直接服务于视频生成的 tokenizer、蒸馏、少步采样和加速。
    keywords:
    - video tokenizer
    - efficient video generation
    - video distillation
  - id: video_generation_evaluation
    name: 视频生成训练与评测
    description: 视频生成的数据、训练、对齐和评测。
    keywords:
    - video generation benchmark
    - video generation alignment
- id: audio_video_generation
  name: 音视频联合生成
  tier: primary
  description: 聚焦音视频联合生成、视频配音配乐音效、声音驱动视频、音画对齐与同步。根据视频或无声人脸/口型生成语音（video-to-speech、visual speech synthesis）、音乐或音效也直接相关，不要求同时生成视频。纯文本到语音或纯音乐生成只有对这些任务有明确、具体迁移价值才相关；普通音频识别或视频理解并非目标。
  arxiv_categories:
  - cs.CV
  - cs.MM
  - cs.SD
  - eess.AS
  - cs.AI
  - cs.LG
  keywords: &id002
  - audio-visual generation
  - audio-video generation
  - video-to-audio
  - video-to-speech
  - audio-to-video
  - sound-driven video
  - foley generation
  - audio visual synchronization
  canonical_subtopics:
  - id: joint_audio_video
    name: 联合音视频生成
    description: 联合生成音频和视频的共享模型或协同模型。
    keywords:
    - joint audio video generation
    - audio-visual generation
    - audio-video generation
  - id: video_soundtrack
    name: 视频配音配乐与音效
    description: 根据视频生成语音、音乐、环境音或 Foley 音效。
    keywords:
    - video-to-audio
    - video-to-speech
    - foley generation
    - video soundtrack
  - id: audio_driven_video
    name: 声音驱动视频
    description: 以语音、音乐或声音生成视频和数字人。
    keywords:
    - audio-driven video
    - speech-driven video
    - audio-driven animation
    - talking head
  - id: audio_video_synchronization
    name: 音画同步与生成评测
    description: 直接服务于音视频生成的时间对齐、同步、数据和评测。
    keywords:
    - audio-visual synchronization
    - audio-video synchronization
    - audio visual generation benchmark
- id: multimodal_understanding_generation
  name: 统一理解与生成
  description: 辅助关注理解与生成共享模型、表征或训练目标的统一多模态研究。普通 VLM、VQA、视频理解或纯多模态推理仅在对世界模型、视频或音视频生成、统一理解生成有明确迁移价值时相关。
  arxiv_categories:
  - cs.CV
  - cs.CL
  - cs.AI
  - cs.MM
  - cs.LG
  keywords: &id003
  - unified multimodal
  - any-to-any
  - understanding and generation
  - unified understanding
  - native multimodal
  canonical_subtopics:
  - id: unified_multimodal_model
    name: 统一多模态模型
    description: 理解与生成一体化、统一 token 表征、Any-to-Any 多模态模型。
    keywords:
    - unified multimodal
    - any-to-any
    - understanding generation
    - native multimodal
  - id: efficient_multimodal
    name: 统一多模态模型高效化
    description: 直接服务于统一理解与生成模型的高效表征、蒸馏和推理。
    keywords:
    - efficient mllm
    - peft
    - multimodal distillation
    - token compression
    - quantization
  tier: secondary
  detail_quota: 5
- id: continuous_language_multimodal
  name: 连续语言模型
  description: 辅助关注连续语言模型、扩散语言模型、语言 embedding/latent 空间、连续语言 token，以及直接相关的连续多模态扩展。通用 flow matching、连续控制或图像潜空间模型本身不能证明与连续语言建模有关。
  arxiv_categories:
  - cs.CL
  - cs.CV
  - cs.AI
  - cs.MM
  - cs.LG
  keywords: &id004
  - continuous language model
  - continuous diffusion language
  - diffusion language model
  - embedded language flow
  - flow matching language
  - cola
  - elf
  - continuous multimodal model
  canonical_subtopics:
  - id: continuous_language_flow
    name: 连续语言模型与语言流
    description: 连续 embedding/latent 空间中的语言建模，包括 ELF、CoLa、扩散语言模型与 flow matching language model。
    keywords:
    - continuous language model
    - continuous latent language model
    - embedded language flow
    - diffusion language model
    - flow matching language
    - cola
    - elf
  - id: continuous_vlm_latent_flow
    name: 连续 VLM 与视觉潜空间流
    description: 与连续语言建模直接相关的连续视觉语言模型及潜空间流，不包括全部视觉 flow matching。
    keywords:
    - continuous vision-language model
    - continuous vlm
    - continuous visual token
    - continuous visual tokens
    - visual latent flow
    - latent flow
    - flow matching
    - visual vae
    - representation autoencoder
    - multimodal latent reasoning
  - id: continuous_multimodal_reasoning
    name: 连续多模态推理与潜空间思维
    description: 多模态模型在连续 latent 中进行 reasoning、planning、visual thought 或 chain-of-continuous-thought。
    keywords:
    - multimodal latent reasoning
    - continuous multimodal reasoning
    - chain of continuous thought
    - continuous vision-language thought
    - latent visual reasoning
    - visual thought
  tier: secondary
  detail_quota: 5
